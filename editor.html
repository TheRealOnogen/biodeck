<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

#toolbar {
    display: flex;
    align-items: center;
    gap: 0;
    background: black;
    border-bottom: 5px solid white;
    padding: 0;
    flex-wrap: wrap;
}

.upload-btn {
    font-family: Quicksand;
    font-size: 13px;
    padding: 6px 14px;
    background: black;
    color: white;
    border: none;
    border-right: 2px solid white;
    cursor: pointer;
    white-space: nowrap;
}
.upload-btn:hover { background: #222; }

#uploaded-files {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 10px;
    flex: 1;
}

.file-chip {
    font-family: Quicksand;
    font-size: 11px;
    color: #aaa;
    background: #111;
    border: 1px solid #444;
    padding: 2px 7px;
    cursor: pointer;
    white-space: nowrap;
}
.file-chip:hover { border-color: white; color: white; }
.file-chip span { color: #555; margin-right: 3px; }

#main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100vh - 37px - 22px);
}

#editor {
    width: 100%;
    height: 100%;
    border: none;
    padding: 12px;
    font-family: Quicksand;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
    background: black;
    color: white;
    border-right: 5px solid white;
}

#preview {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

#statusbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 4px 10px;
    font-size: 11px;
    font-family: Quicksand; 
    color: white;
    background: black;
    border-top: 5px solid white;
    display: flex;
    justify-content: left;
}

input[type="file"] { display: none; }
</style>
</head>
<body>

<div id="toolbar">
    <button class="upload-btn" onclick="document.getElementById('img-input').click()">+ image</button>
    <input type="file" id="img-input" accept="image/*" multiple onchange="handleUpload(this, 'images')">

    <button class="upload-btn" onclick="document.getElementById('css-input').click()">+ css</button>
    <input type="file" id="css-input" accept=".css" multiple onchange="handleUpload(this, 'styles')">

    <div id="uploaded-files"></div>
</div>

<div id="main">
    <textarea id="editor" spellcheck="false" placeholder="Type HTML here..."></textarea>
    <iframe id="preview"></iframe>
</div>

<div id="statusbar">
    <span id="cursor-info">line 1, col 1</span>
    <a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a>
    <span id="char-count" style="align-items: center;">0 chars</span>
    <a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a>
    <a href="/feed" style="color: rgb(0, 191, 255);">Feed</a>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const cursorInfo = document.getElementById('cursor-info');
const charCount = document.getElementById('char-count');
const uploadedFiles = document.getElementById('uploaded-files');

const LS_FILES_KEY = 'htmleditor_files';
const LS_EDITOR_KEY = 'htmleditor_content';

const fileRegistry = {};

function saveRegistry() {
    localStorage.setItem(LS_FILES_KEY, JSON.stringify(fileRegistry));
}

function loadRegistry() {
    try {
        const stored = localStorage.getItem(LS_FILES_KEY);
        if (stored) {
            const parsed = JSON.parse(stored);
            Object.entries(parsed).forEach(([vpath, dataURL]) => {
                fileRegistry[vpath] = dataURL;
                const folder = vpath.split('/')[0];
                addChip(vpath, folder);
            });
        }
    } catch (e) {}
}

const starter = `<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 16px; background-color: black; color: white; }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
</body>
</html>`;

editor.value = localStorage.getItem(LS_EDITOR_KEY) || starter;

loadRegistry();
render();

editor.addEventListener('input', () => {
    localStorage.setItem(LS_EDITOR_KEY, editor.value);
    render();
});
editor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
        e.preventDefault();
        const s = this.selectionStart, end = this.selectionEnd;
        this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = s + 2;
        localStorage.setItem(LS_EDITOR_KEY, editor.value);
        render();
    }
});
editor.addEventListener('keyup', updateStatus);
editor.addEventListener('click', updateStatus);

function handleUpload(input, folder) {
    const files = Array.from(input.files);
    let loaded = 0;
    files.forEach(file => {
        const virtualPath = folder + '/' + file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
            fileRegistry[virtualPath] = e.target.result;
            addChip(virtualPath, folder);
            loaded++;
            if (loaded === files.length) {
                saveRegistry();
                render();
            }
        };
        reader.readAsDataURL(file);
    });
    input.value = '';
}

function addChip(virtualPath, folder) {
    const existing = document.querySelector(`.file-chip[data-path="${virtualPath}"]`);
    if (existing) existing.remove();

    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.dataset.path = virtualPath;
    chip.title = 'Click to insert · Right-click to remove';
    chip.innerHTML = `<span>${folder}/</span>${virtualPath.split('/')[1]}`;
    chip.onclick = () => insertPath(virtualPath, folder);
    chip.oncontextmenu = (e) => { e.preventDefault(); removeFile(virtualPath); };
    uploadedFiles.appendChild(chip);
}

function removeFile(virtualPath) {
    delete fileRegistry[virtualPath];
    saveRegistry();
    const chip = document.querySelector(`.file-chip[data-path="${virtualPath}"]`);
    if (chip) chip.remove();
    render();
}

function insertPath(virtualPath, folder) {
    editor.focus();
    const s = editor.selectionStart, e = editor.selectionEnd;
    let snippet;
    if (folder === 'images') {
        snippet = `<img src="${virtualPath}" alt="">`;
    } else {
        snippet = `<link rel="stylesheet" href="${virtualPath}">`;
    }
    editor.value = editor.value.substring(0, s) + snippet + editor.value.substring(e);
    editor.selectionStart = editor.selectionEnd = s + snippet.length;
    localStorage.setItem(LS_EDITOR_KEY, editor.value);
    render(); updateStatus();
}

function render() {
    let html = editor.value;
    Object.entries(fileRegistry).forEach(([vpath, dataURL]) => {
        html = html.split(vpath).join(dataURL);
    });
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    charCount.textContent = editor.value.length + ' chars';
}

function updateStatus() {
    const val = editor.value.substring(0, editor.selectionStart);
    const lines = val.split('\n');
    cursorInfo.textContent = 'line ' + lines.length + ', col ' + lines[lines.length - 1].length;
}
</script>
</body>
</html>
