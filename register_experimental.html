<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/x-icon" href="/Biodeck.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap">
<link rel="stylesheet" href="/theme.css">
<meta property="og:title" content="Welcome to Biodeck Experimental!" />
<meta property="og:description" content="Biodeck Experimental is just Biodeck but with experimental features before they get pushed to the repo" />
<meta property="og:url" content="https://biodeck-expr.onogenatedwater.dpdns.org"/>
<meta property="og:image" content="https://biodeck-expr.onogenatedwater.dpdns.org/Ellie.png" />
<meta name="theme-color" content="#FFFFFF" />
<meta property="og:type" content="website" />
</head>
<body>
    <div class="box" style="color: white; height: auto; width: min(500px, 80vw);">
        <h1>Unable to register</h1><br>
        <h3>Due to security reasons registration is disabled on experimental version of biodeck, contact biodecksupport@gmail.com to apply for an experimental version of biodeck</h3>
    </div>
    <script>
        document.querySelectorAll('.button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.classList.add('clicked');
                setTimeout(() => btn.classList.remove('clicked'), 150);
            });
        });
    </script>
</body>
</html>
